name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: VPK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with the pinned VitaSDK image
        run: ./port/vita/build.sh
      - name: Package the VPK and its checksum
        run: |
          mkdir -p dist
          cp port/vita/sh2vita.vpk dist/
          cd dist && sha256sum sh2vita.vpk > sh2vita.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sh2vita-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sh2vita-${{ github.sha }}
          path: dist

      # A tag with a suffix (v0.1.0-rc.1) is a prerelease: a test build ahead of VERSION, published as
      # a prerelease so releases/latest keeps pointing at the last full release.
      - name: Check that the tag matches VERSION
        run: |
          expected="v$(tr -d '[:space:]' < VERSION)"
          case "${GITHUB_REF_NAME}" in *-*) exit 0 ;; esac
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${expected})." >&2
            exit 1
          fi

      - name: Verify the checksum
        run: cd dist && sha256sum -c sh2vita.sha256

      # The notes are .github/releases/<tag>.md when it exists (what changed), then the install steps
      # in .github/release-notes.md and the checksum.
      - name: Release notes
        run: |
          {
            if [ -f ".github/releases/${GITHUB_REF_NAME}.md" ]; then
              cat ".github/releases/${GITHUB_REF_NAME}.md"; echo
            fi
            cat .github/release-notes.md
            echo
            echo '```'
            cat dist/sh2vita.sha256
            echo '```'
          } > notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "${GITHUB_REF_NAME}" in *-*) pre="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            dist/sh2vita.vpk dist/sh2vita.sha256 \
            --title "sh2-vita ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag ${pre}
